<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login / Daftar - Hey Matcha</title>
<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f5f3c;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

/* Kotak Login/Daftar */
.container {
    background: rgba(255,255,255,0.1);
    padding: 40px 30px;
    border-radius: 20px;
    width: 350px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.5);
    text-align: center;
}

/* Judul */
h2 {
    margin-bottom: 20px;
    font-size: 26px;
}

/* Input */
input[type=text], input[type=password], input[type=email] {
    width: 100%;
    padding: 12px 15px;
    margin: 8px 0;
    border-radius: 10px;
    border: none;
    font-size: 15px;
}

/* Tombol */
.btn {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    border-radius: 30px;
    border: none;
    background: #25D366;
    color: white;
    font-weight: bold;
    cursor: pointer;
    font-size: 16px;
    transition: 0.3s;
}

.btn:hover {
    background: #1ebe5a;
}

/* Subtitle daftar */
.subtitle {
    margin: 20px 0 10px 0;
    font-size: 16px;
    color: #f0f0f0;
}

/* Link beranda */
a.home {
    display: block;
    margin-top: 15px;
    color: #f1fa8c;
    text-decoration: none;
    font-weight: bold;
}
</style>
</head>
<body>

<div class="container">
    <h2>Login & Daftar - Hey Matcha</h2>

    <!-- LOGIN -->
    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">
    <button class="btn" onclick="login()">Login</button>

    <div class="subtitle">Belum punya akun? Daftar di bawah</div>

    <!-- DAFTAR -->
    <input type="text" id="newuser" placeholder="Username baru">
    <input type="email" id="newemail" placeholder="Email">
    <input type="password" id="newpass" placeholder="Password baru">
    <button class="btn" onclick="daftar()">Daftar</button>

    <a class="home" href="index.html">🏠 Kembali ke Beranda</a>
</div>

<script>
function login() {
    const user = document.getElementById("username").value;
    const pass = document.getElementById("password").value;

    if(!user || !pass){
        alert("Isi username dan password");
        return;
    }

    let users = JSON.parse(localStorage.getItem("users") || "[]");
    let found = users.find(u => u.username === user && u.password === pass);

    if(found){
        localStorage.setItem("currentUser", user);
        window.location.href = "rating.html";
    } else {
        alert("Username atau Password salah");
    }
}

function daftar() {
    const user = document.getElementById("newuser").value.trim();
    const email = document.getElementById("newemail").value.trim();
    const pass = document.getElementById("newpass").value.trim();

    if(!user || !email || !pass){
        alert("Isi semua field");
        return;
    }

    let users = JSON.parse(localStorage.getItem("users") || "[]");
    if(users.find(u => u.email === email)){
        alert("Email sudah terdaftar");
        return;
    }

    users.push({username: user, email: email, password: pass});
    localStorage.setItem("users", JSON.stringify(users));
    alert("Pendaftaran berhasil! Silakan login");
}
</script>

</body>
</html>
