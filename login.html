<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login / Daftar - Hey Matcha</title>

<style>
body {
    margin:0;
    font-family: Arial, sans-serif;
    background:#0f5f3c;
    color:white;
    text-align:center;
}

.container {
    max-width: 350px;
    margin: 60px auto;
    background: rgba(255,255,255,0.1);
    padding: 30px;
    border-radius: 15px;
}

h2 {
    margin-bottom: 20px;
}

input[type=text], input[type=password], input[type=email] {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    border-radius: 10px;
    border: none;
}

.btn {
    width: 100%;
    padding: 12px;
    border-radius: 30px;
    border:none;
    background:#25D366;
    color:white;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
    margin-top: 10px;
}

.btn:hover {
    background:#1ebe5a;
}

a.home {
    display:block;
    margin-top:15px;
    color:#f1fa8c;
    text-decoration:none;
}

.toggle {
    color:#f1fa8c;
    cursor:pointer;
    margin-top:10px;
    display:block;
}
</style>
</head>

<body>

<div class="container" id="loginBox">
    <h2>Login untuk Rating</h2>
    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">
    <button class="btn" onclick="login()">Login</button>
    <span class="toggle" onclick="toggleForm()">Belum punya akun? Daftar</span>
    <a class="home" href="index.html">🏠 Kembali ke Beranda</a>
</div>

<div class="container" id="registerBox" style="display:none;">
    <h2>Daftar Akun Baru</h2>
    <input type="text" id="newUser" placeholder="Username">
    <input type="email" id="newEmail" placeholder="Email">
    <input type="password" id="newPass" placeholder="Password">
    <button class="btn" onclick="register()">Daftar</button>
    <span class="toggle" onclick="toggleForm()">Sudah punya akun? Login</span>
    <a class="home" href="index.html">🏠 Kembali ke Beranda</a>
</div>

<script>
function toggleForm(){
    const loginBox = document.getElementById("loginBox");
    const registerBox = document.getElementById("registerBox");
    if(loginBox.style.display === "none"){
        loginBox.style.display = "block";
        registerBox.style.display = "none";
    } else {
        loginBox.style.display = "none";
        registerBox.style.display = "block";
    }
}

// Fungsi Login
function login() {
    const user = document.getElementById("username").value;
    const pass = document.getElementById("password").value;

    if(!user || !pass){
        alert("Silakan isi Username dan Password");
        return;
    }

    let users = JSON.parse(localStorage.getItem("users") || "{}");

    if(users[user] && users[user].pass === pass){
        alert("Login berhasil! Sekarang bisa beri rating.");
        window.location.href = "rating.html";
    } else {
        alert("Username atau Password salah / belum terdaftar");
    }
}

// Fungsi Register
function register(){
    const user = document.getElementById("newUser").value.trim();
    const email = document.getElementById("newEmail").value.trim();
    const pass = document.getElementById("newPass").value.trim();

    if(!user || !email || !pass){
        alert("Semua kolom wajib diisi");
        return;
    }

    let users = JSON.parse(localStorage.getItem("users") || "{}");

    // Cek username atau email sudah ada
    for(let key in users){
        if(key === user || users[key].email === email){
            alert("Username atau Email sudah digunakan!");
            return;
        }
    }

    users[user] = { email: email, pass: pass };
    localStorage.setItem("users", JSON.stringify(users));

    alert("Daftar berhasil! Silakan login.");
    toggleForm(); // kembali ke login
}
</script>

</body>
</html>
