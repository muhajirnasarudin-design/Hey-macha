<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hey Matcha - Menu</title>

<style>
body {
    margin:0;
    font-family: Arial, sans-serif;
    background:#0f5f3c;
    color:white;
    text-align:center;
}

h1 {
    margin-top:50px;
}

.menu-area {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 25px;
    margin: 30px 10px;
}

.card {
    background:white;
    color:black;
    border-radius:15px;
    width:200px;
    overflow:hidden;
    box-shadow:0 8px 20px rgba(0,0,0,0.4);
    transition:0.3s;
}

.card:hover {
    transform:translateY(-5px);
}

.card img {
    width:100%;
    height:140px;
    object-fit:cover;
}

.card h3 {
    margin:10px 0;
}

a.home {
    display:inline-block;
    margin:20px 0;
    padding:12px 20px;
    border-radius:30px;
    background:#f1fa8c;
    color:black;
    text-decoration:none;
    font-weight:bold;
}
a.home:hover {
    background:#e0e500;
}
</style>
</head>

<body>

<h1>Menu Lengkap Hey Matcha</h1>

<div class="menu-area">
<div class="card">
            <img src="19.jpg" alt="Yogurt Matcha">
            <h3>Yogurt Matcha</h3>
        </div>

        <div class="card">
            <img src="20.jpg" alt="Lemon Matcha">
            <h3>Lemon Matcha</h3>
        </div>

        <div class="card">
            <img src="21.jpg" alt="Coconut Matcha">
            <h3>Coconut Matcha</h3>
        </div>

        <div class="card">
            <img src="23.jpg" alt="Signature Matcha">
            <h3>Signature Matcha</h3>
        </div>

        <div class="card">
            <img src="22.jpg" alt="Caramelo Matcha">
            <h3>Caramelo Matcha</h3>
        </div>

        <div class="card">
            <img src="24.jpg" alt="Cookies Matcha">
            <h3>Cookies Matcha</h3>
        </div>
</div>

<a class="home" href="index.html">🏠 Kembali ke Beranda</a>

</body>
</html>
