<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rating - Hey Matcha</title>

<style>
body {
    margin:0;
    font-family: Arial, sans-serif;
    background:#0f5f3c;
    color:white;
    text-align:center;
}

.container {
    max-width: 400px;
    margin: 80px auto;
    background: rgba(255,255,255,0.1);
    padding: 30px;
    border-radius: 15px;
}

h2 {
    margin-bottom: 20px;
}

label {
    display:block;
    margin: 10px 0 5px;
}

textarea {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: none;
    resize: none;
}

select {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: none;
    margin-bottom: 15px;
    font-size: 16px;
}

.btn {
    width: 100%;
    padding: 12px;
    border-radius: 30px;
    border:none;
    background:#25D366;
    color:white;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

.btn:hover {
    background:#1ebe5a;
}

a.home {
    display:block;
    margin-top:15px;
    color:#f1fa8c;
    text-decoration:none;
}
</style>
</head>

<body>

<div class="container">
    <h2>Berikan Rating</h2>

    <label for="bintang">Pilih Bintang</label>
    <select id="bintang">
        <option value="">-- Pilih Rating --</option>
        <option value="5">⭐⭐⭐⭐⭐</option>
        <option value="4">⭐⭐⭐⭐</option>
        <option value="3">⭐⭐⭐</option>
        <option value="2">⭐⭐</option>
        <option value="1">⭐</option>
    </select>

    <label for="komentar">Komentar</label>
    <textarea id="komentar" rows="4" placeholder="Tulis komentar Anda..."></textarea>

    <button class="btn" onclick="submitRating()">Submit Rating</button>

    <a class="home" href="index.html">🏠 Kembali ke Beranda</a>
</div>

<script>
function submitRating() {
    const bintang = document.getElementById("bintang").value;
    const komentar = document.getElementById("komentar").value.trim();

    if(!bintang) {
        alert("Silakan pilih bintang rating");
        return;
    }

    if(!komentar) {
        alert("Silakan tulis komentar Anda");
        return;
    }

    alert("Terima kasih! Rating Anda telah dikirim.\nBintang: " + bintang + "\nKomentar: " + komentar);

    // Reset form
    document.getElementById("bintang").value = "";
    document.getElementById("komentar").value = "";
}
</script>

</body>
</html>
